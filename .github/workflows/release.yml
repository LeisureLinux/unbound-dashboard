name: Release .deb packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            deb_arch: amd64
            cc: gcc
            pkg_prefix: ""
          - goarch: arm64
            deb_arch: arm64
            cc: aarch64-linux-gnu-gcc
            pkg_prefix: "gcc-aarch64-linux-gnu"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install cross-compiler (arm64)
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg_prefix }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "Building version: $TAG"

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          go build -ldflags="-s -w" -o bins/unbound-dashboard ./cmd/
          file bins/unbound-dashboard

      - name: Build .deb package
        run: |
          bash packaging/build-deb.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.deb_arch }}" \
            "bins/unbound-dashboard"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.deb_arch }}
          path: unbound-dashboard_${{ steps.version.outputs.version }}_${{ matrix.deb_arch }}.deb

  release:
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release and Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          
          # 创建 release（如果不存在）
          if ! gh release view "$TAG" &>/dev/null; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Unbound DNS Dashboard $VERSION
          
          - DNSTap and verbose-log dual data source modes
          - SQLite storage, single binary deployment
          - REST API: /stats (JSON), /debug (Text)
          - HTML dashboard with auto-refresh
          - amd64 and arm64 .deb packages"
          fi
          
          # 上传所有 .deb 文件
          for deb in artifacts/*.deb; do
            echo "Uploading $deb..."
            gh release upload "$TAG" "$deb" --clobber
          done
          
          echo "✅ Release complete!"

  # ===== 发布到自建 APT 仓库（gh-pages 分支）=====
  publish-apt:
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: debs
          merge-multiple: true

      - name: List downloaded files
        run: ls -la debs/

      - name: Build and publish apt repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          
          # 配置 git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          WORK_DIR=$(mktemp -d)
          cd "$WORK_DIR"
          
          # 尝试 clone gh-pages 分支
          if git clone --branch gh-pages --depth 1 "$REPO_URL" . 2>/dev/null; then
            echo "✅ 已有 gh-pages 分支"
          else
            echo "📦 初始化 gh-pages 分支"
            git init
            git checkout -b gh-pages
            git remote add origin "$REPO_URL"
            echo "# APT Repository" > README.md
            echo "This branch serves as an APT repository for unbound-dashboard." >> README.md
            git add README.md
            git commit -m "Initial apt repo"
            git push -u origin gh-pages
          fi
          
          # 复制 .deb 文件到仓库根目录
          cp "$GITHUB_WORKSPACE/debs/"*.deb .
          echo "📦 当前 .deb 文件:"
          ls -la *.deb
          
          # 安装 apt-utils（提供 apt-ftparchive）
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils
          
          # 生成 Packages 索引
          apt-ftparchive packages . > Packages
          gzip -k -f Packages
          
          # 生成 Release 元数据
          apt-ftparchive release . > Release
          
          # 可选：GPG 签名（如果配置了 APT_GPG_KEY secret）
          if [ -n "${{ secrets.APT_GPG_KEY }}" ]; then
            echo "🔑 导入 GPG key 并签名..."
            echo "${{ secrets.APT_GPG_KEY }}" | gpg --batch --import
            gpg -abs -o InRelease Release
            gpg -abs -o Release.gpg Release
            echo "✅ Release 已签名"
          else
            echo "ℹ️ 未配置 APT_GPG_KEY，跳过签名（用户需用 [trusted=yes]）"
          fi
          
          # 提交并推送
          git add -A
          git commit -m "apt: update for ${{ github.ref_name }}" || {
            echo "⚠️ 无变更，跳过推送"
            exit 0
          }
          git push origin gh-pages
          echo "✅ APT 仓库已更新！"
