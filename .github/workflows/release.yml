name: Release .deb packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            deb_arch: amd64
            cc: gcc
            pkg_prefix: ""
          - goarch: arm64
            deb_arch: arm64
            cc: aarch64-linux-gnu-gcc
            pkg_prefix: "gcc-aarch64-linux-gnu"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install cross-compiler (arm64)
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg_prefix }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "Building version: $TAG"

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          go build -ldflags="-s -w" -o bins/unbound-dashboard ./cmd/
          file bins/unbound-dashboard

      - name: Build .deb package
        run: |
          bash packaging/build-deb.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.deb_arch }}" \
            "bins/unbound-dashboard"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.deb_arch }}
          path: unbound-dashboard_${{ steps.version.outputs.version }}_${{ matrix.deb_arch }}.deb

  release:
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release and Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          
          # 创建 release（如果不存在）
          if ! gh release view "$TAG" &>/dev/null; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Unbound DNS Dashboard $VERSION
          
          - DNSTap and verbose-log dual data source modes
          - SQLite storage, single binary deployment
          - REST API: /stats (JSON), /debug (Text)
          - HTML dashboard with auto-refresh
          - amd64 and arm64 .deb packages"
          fi
          
          # 上传所有 .deb 文件
          for deb in artifacts/*.deb; do
            echo "Uploading $deb..."
            gh release upload "$TAG" "$deb" --clobber
          done
          
          echo "✅ Release complete!"

  # ===== 自动同步到 Freelamp APT 仓库（repo.freelamp.com）=====
  publish-apt:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to apt-repo
        env:
          APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsSL -X POST https://api.github.com/repos/LeisureLinux/apt-repo/dispatches \
            -H "Authorization: Bearer ${APT_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"event_type\":\"publish\",\"client_payload\":{\"owner\":\"LeisureLinux\",\"repo\":\"unbound-dashboard\",\"tag\":\"${TAG}\"}}"
          echo "✅ 已通知 apt-repo 同步 unbound-dashboard@${TAG}"
