name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race -count=1 ./...

      - name: go test coverage
        run: go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -5

      - name: govulncheck
        continue-on-error: true
        env:
          GOTOOLCHAIN: local
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Verify config validation
        run: |
          go run ./cmd/ --test-config --dnstap /tmp/t.sock
          if go run ./cmd/ --test-config --dnstap /tmp/t.sock --log-file /tmp/x.log >/dev/null 2>&1; then
            echo "::error::mutually exclusive sources were accepted"
            exit 1
          fi
